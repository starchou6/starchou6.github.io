name = "blog-ai-qa"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://starchou6.github.io,http://localhost:1313"
DAILY_LIMIT = "20"
GLOBAL_DAILY_LIMIT = "200"
