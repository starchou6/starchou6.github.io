name = "blog-ai-qa"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BLOG_URL = "https://starchou6.github.io"
ALLOWED_ORIGINS = "https://starchou6.github.io,http://localhost:1313"
# MODEL = "claude-opus-5-5"

# Per-IP limit: 10 questions per minute. namespace_id is any number unique in your account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
