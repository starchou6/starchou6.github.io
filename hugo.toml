baseURL = "https://starchou6.github.io/"
defaultContentLanguage = "en"
# English stays at the site root (/posts/...); other languages get a prefix (/zh/posts/...).
defaultContentLanguageInSubdir = false
# Makes word counts and reading times correct for Chinese and Japanese.
hasCJKLanguage = true
title = "Zhou Jing's Tech Blog"
theme = "PaperMod"

[params]
  author = "Zhou Jing"
  description = "Software Engineer | C# / .NET / AWS | Tokyo, Japan"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false
  defaultTheme = "auto"
  # Show "简体中文" rather than "Zh" in the language switcher.
  displayFullLangName = true

  [params.homeInfoParams]
    Title = "Zhou Jing — Software Engineer"
    Content = "📍 Tokyo, Japan\n\n---\n\n**Current Role**\n\nAI Application Developer & Software Engineer & Technical Lead · MicroWorld Co., Ltd. (Feb 2023 – Present)\n\n**Education**\n\nM.Eng. Electronic Information Engineering · University of Electronic Science and Technology of China (2021)\n\n**Tech Stack**\n\nC# .NET · Oracle · AWS · Azure · Langchain/LangGraph · Semantic Kernel\n\n**Certifications**\n\nAWS Certified DevOps Engineer – Professional\n\n**Languages**\n\nChinese (Native) · Japanese (Business) · English (TOEIC 835)\n\n---\n\nThis blog is where I share practical experience with AI, .NET, AWS, and cloud engineering."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/starchou6"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/zhoujing-a60a5a277"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    style = "dracula"
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 5

# AI Q&A widget. It shows only when `endpoint` points at the deployed
# Cloudflare Worker in ai-worker/ and the local bridge is online
# (see ai-worker/README.md).
[params.aiChat]
  endpoint = "https://blog-ai-qa.starchou666.workers.dev"
  title = "Ask the blog"
  greeting = "Hi! Ask me anything about the posts on this blog."
  placeholder = "Type your question…"
  send = "Send"

# Each language overrides the site title, description, homepage intro, menu
# and AI chat text. Translate a post by adding e.g. my-post.zh.md next to
# my-post.md.
[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1
    [[languages.en.menus.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10
    [[languages.en.menus.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[languages.en.menus.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 30

