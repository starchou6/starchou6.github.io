name: Deploy Hugo Blog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PaperMod theme
        env:
          PAPERMOD_COMMIT: 969bebdc5600a1639158b5ef4eff9cf6cbb511ac
        run: |
          git init -q themes/PaperMod
          git -C themes/PaperMod fetch -q --depth=1 https://github.com/adityatelange/hugo-PaperMod.git "$PAPERMOD_COMMIT"
          git -C themes/PaperMod checkout -q FETCH_HEAD

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: List generated files
        run: find public -type f | head -20

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
